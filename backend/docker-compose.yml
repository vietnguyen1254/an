name: an

networks:
  edge:
  internal:

volumes:
  pgdata:
  certbot-etc:
  certbot-www:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Tuned for a ~1.4 GB box. shared_buffers small, connections capped.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 420m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build: .
    image: an-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=200"
      PORT: "8080"
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase.json:ro
    networks: [edge, internal]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 300m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/an.conf.template:/etc/nginx/templates/an.conf.template:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - ./media:/var/www/media:ro
    environment:
      DOMAIN: ${DOMAIN}
    networks: [edge]
    depends_on: [api]
    mem_limit: 96m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renew twice a day; nginx picks up new certs on its own reload cycle
    entrypoint: >
      sh -c 'trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done'
    mem_limit: 96m

  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./backups:/backups
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
